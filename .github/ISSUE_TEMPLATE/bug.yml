name: 问题反馈
description: 展示、连接或兼容性问题
body:
  - type: markdown
    attributes:
      value: 请勿附带有效配对码、认证信息或真实会话内容。安全问题请使用私密漏洞报告。
  - type: input
    id: version
    attributes:
      label: 副屏 / Codex / 操作系统版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果与脱敏截图
